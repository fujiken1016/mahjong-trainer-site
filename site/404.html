<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ページが見つかりません | 雀トレ</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#151038">
<style>
  :root{--bg1:#151038;--bg2:#0a1030;--text:#eef2ff;--sub:#9aa5c9;--cyan:#34e5ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(150deg,var(--bg1),var(--bg2) 60%,#071022);color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh;line-height:1.8;
    display:flex;align-items:center;justify-content:center}
  .nf{max-width:560px;padding:48px 22px;text-align:center}
  .code{font-size:3.4rem;font-weight:800;color:var(--cyan);letter-spacing:.04em}
  h1{font-size:1.2rem;margin:10px 0 8px}
  p{color:var(--sub);font-size:.92rem}
  .back{display:inline-block;margin-top:28px;
    background:linear-gradient(135deg,var(--cyan),#3b82f6);color:#04121f;
    text-decoration:none;font-weight:800;font-size:.95rem;border-radius:12px;padding:14px 32px;
    box-shadow:0 4px 16px rgba(52,229,255,.35)}
</style>
</head>
<body>
<div class="nf">
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動したか、削除された可能性があります。</p>
  <a class="back" href="/">雀トレ トップへ</a>
</div>
</body>
</html>
